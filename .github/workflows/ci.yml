name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check ingestion data_quality data_generator scripts tests run_local.py bi
      - name: Unit tests
        run: pytest -q tests

  pipeline-e2e:
    # Full pipeline on DuckDB: generate -> extract -> validate -> load -> dbt build -> DQ -> reconciliation
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python run_local.py --target ci
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: |
            warehouse/dq_report.json
            warehouse/reconciliation_report.json
            bi/dashboard_data.json

  dbt-snowflake-slim-ci:
    # Builds only modified models (+ children) into a PR schema, deferring to prod for the rest
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/key.p8
      DBT_USER: pr_${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install dbt-snowflake
      - run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/key.p8
      - name: Fetch prod manifest for state comparison
        run: aws s3 cp s3://shopstream-dbt-artifacts/prod/manifest.json dbt/prod-state/manifest.json
      - name: Slim CI build
        working-directory: dbt
        run: |
          dbt build --target dev --select state:modified+ --defer --state prod-state --profiles-dir .

  terraform:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: infra/terraform}}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
